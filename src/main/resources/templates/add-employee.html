<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head><meta charset="UTF-8"><title>Add Employee</title>
<style>
body{background:linear-gradient(135deg,#e0e7ff,#f5f3ff);font-family:'Segoe UI';margin:0;display:flex;justify-content:center;align-items:center;min-height:100vh}
.box{background:white;width:520px;padding:35px;border-radius:20px;box-shadow:0 15px 35px rgba(0,0,0,0.1)}
h2{text-align:center;color:#1a237e;margin-bottom:20px}
input,select{width:100%;padding:13px;margin:10px 0;border-radius:10px;border:1.5px solid #d1d5db;box-sizing:border-box;font-size:14px}
input:focus,select:focus{border-color:#1a237e;outline:none}
button{background:linear-gradient(90deg,#1a237e,#3949ab);color:white;width:100%;padding:14px;border:none;border-radius:10px;font-size:16px;font-weight:bold;cursor:pointer;margin-top:10px}
button:hover{opacity:0.9}
a{color:#1a237e;text-decoration:none}
</style>
</head>
<body>
<div class="box">
<h2>Add New Employee</h2>
<form th:action="@{/save-employee}" th:object="${employee}" method="post">
<input type="text" th:field="*{name}" placeholder="Full Name (Ex: Haseena Shaik)" required>
<input type="email" th:field="*{email}" placeholder="Email (Ex: haseena@smarthr.com)" required>
<select th:field="*{department}" required>
<option value="">Select Department</option>
<option value="IT">IT Department</option>
<option value="HR">HR Department</option>
<option value="Finance">Finance</option>
<option value="Sales">Sales & Marketing</option>
<option value="Operations">Operations</option>
</select>
<input type="text" th:field="*{designation}" placeholder="Designation (Ex: Java Developer)" required>
<input type="number" step="0.01" th:field="*{salary}" placeholder="Monthly Salary ₹" required>
<button type="submit">Save Employee to Database</button>
</form>
<br><center><a href="/employees">← Back to Employee List</a></center>
</div>
</body>
</html>
